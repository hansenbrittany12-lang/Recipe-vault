<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Recipe Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0a06;
    --bg2: #1a1208;
    --bg3: #0e0a06;
    --border: #2e2418;
    --border2: #3a2e1a;
    --gold: #D4A853;
    --gold-dim: #8a6a30;
    --text: #f0e4c8;
    --text2: #c0a878;
    --text3: #8a7a60;
    --text4: #6a5a40;
    --text5: #4a3a20;
    --green: #7dc45a;
    --green-bg: #2a3d1e;
    --green-border: #4a6a30;
    --red: #9a4a4a;
    --red-border: #5a2a2a;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  button { cursor: pointer; font-family: 'DM Mono', monospace; }
  input, textarea { font-family: 'DM Mono', monospace; }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 14px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px; color: var(--gold); letter-spacing: -0.5px;
  }
  .header-count { font-size: 10px; color: var(--text4); letter-spacing: 1px; margin-top: 2px; }
  .btn-add {
    background: var(--gold); color: #1a1208;
    border: none; border-radius: 8px;
    padding: 10px 16px; font-size: 13px; font-weight: 700;
    letter-spacing: 0.5px;
  }
  .btn-add:active { opacity: 0.8; }

  /* ── FILTER BAR ── */
  .filter-bar {
    padding: 14px 20px 0;
    border-bottom: 1px solid #1e1810;
  }
  .search-input {
    width: 100%; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: 8px;
    color: var(--text); padding: 10px 14px; font-size: 13px;
    outline: none; margin-bottom: 10px;
  }
  .search-input::placeholder { color: var(--text4); }
  .tags-row {
    display: flex; gap: 6px; flex-wrap: nowrap;
    overflow-x: auto; padding-bottom: 10px;
    scrollbar-width: none;
  }
  .tags-row::-webkit-scrollbar { display: none; }
  .sort-row {
    display: flex; gap: 12px; align-items: center;
    padding-bottom: 12px;
  }
  .sort-label { font-size: 10px; color: var(--text4); letter-spacing: 0.5px; }
  .sort-btn {
    font-size: 10px; letter-spacing: 0.5px;
    background: none; border: none;
    color: var(--text5); padding: 0;
    border-bottom: 1px solid transparent;
    padding-bottom: 1px;
  }
  .sort-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ── TAG BADGE ── */
  .tag {
    display: inline-block; padding: 3px 10px;
    border-radius: 20px; font-size: 11px; letter-spacing: 0.5px;
    white-space: nowrap; cursor: pointer; user-select: none;
    border: 1px solid var(--border);
    background: var(--bg2); color: var(--text3);
    transition: all 0.15s;
  }
  .tag.active {
    background: var(--gold); color: #1a1208;
    border-color: var(--gold); font-weight: 600;
  }
  .tag-made { border-color: var(--green-border); color: var(--green); background: var(--green-bg); }
  .tag-made.active { background: var(--green); color: #1a1208; }

  /* ── GRID ── */
  .grid {
    padding: 16px 20px 100px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 600px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }

  /* ── RECIPE CARD ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px;
    cursor: pointer; position: relative;
    transition: border-color 0.15s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { transform: scale(0.98); border-color: var(--gold); }
  .card-made-badge {
    position: absolute; top: 12px; right: 12px;
    background: var(--green-bg); color: var(--green);
    font-size: 9px; letter-spacing: 0.5px;
    padding: 2px 7px; border-radius: 20px;
    border: 1px solid var(--green-border);
  }
  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px; color: var(--text); line-height: 1.35;
    margin-bottom: 5px; padding-right: 60px;
  }
  .card-source {
    font-size: 10px; color: var(--text4);
    margin-bottom: 8px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; }
  .card-date { font-size: 10px; color: var(--text5); }
  .card-note {
    margin-top: 10px; font-size: 12px; color: var(--text3);
    font-style: italic; border-top: 1px solid var(--border);
    padding-top: 10px; line-height: 1.5;
  }

  /* ── STARS ── */
  .stars { display: flex; gap: 2px; }
  .star { font-size: 16px; color: var(--border); transition: color 0.12s; line-height: 1; }
  .star.on { color: var(--gold); }
  .stars.interactive .star { font-size: 24px; }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center; padding: 80px 20px;
  }
  .empty-icon { font-size: 48px; margin-bottom: 14px; }
  .empty-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px; color: var(--text4); margin-bottom: 8px;
  }
  .empty-sub { font-size: 12px; color: var(--text5); }

  /* ── MODAL OVERLAY ── */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(10,8,4,0.88);
    backdrop-filter: blur(4px);
    display: flex; align-items: flex-end;
    animation: fadeIn 0.2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: #120e08;
    border: 1px solid var(--border2);
    border-radius: 20px 20px 0 0;
    width: 100%; max-height: 92vh;
    overflow-y: auto;
    animation: slideUp 0.25s cubic-bezier(0.32,0.72,0,1);
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .sheet-handle {
    width: 36px; height: 4px; background: var(--border2);
    border-radius: 2px; margin: 12px auto 0;
  }
  .sheet-inner { padding: 20px 22px 24px; }
  .sheet-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--gold); margin-bottom: 20px;
  }

  /* ── FORM FIELDS ── */
  .field-label {
    font-size: 10px; color: var(--text3);
    letter-spacing: 0.5px; margin-bottom: 5px;
    display: block;
  }
  .field-input, .field-textarea {
    width: 100%; background: var(--bg3);
    border: 1px solid var(--border2); border-radius: 8px;
    color: var(--text); padding: 10px 14px; font-size: 14px;
    outline: none; margin-bottom: 14px;
  }
  .field-input:focus, .field-textarea:focus { border-color: var(--gold-dim); }
  .field-input::placeholder, .field-textarea::placeholder { color: var(--text5); }
  .field-textarea { resize: vertical; }

  /* ── CHECKBOX ── */
  .check-row {
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none; margin-bottom: 22px;
  }
  .check-box {
    width: 18px; height: 18px; border-radius: 4px;
    border: 2px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--green); flex-shrink: 0;
  }
  .check-box.checked { border-color: var(--green); background: var(--green-bg); }
  .check-label { font-size: 13px; color: var(--text3); }

  /* ── BUTTONS ── */
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn-primary {
    flex: 1; background: var(--gold); color: #1a1208;
    border: none; border-radius: 8px; padding: 13px;
    font-size: 14px; font-weight: 700; letter-spacing: 0.5px;
  }
  .btn-primary:disabled { background: #2a2010; color: var(--text4); cursor: not-allowed; }
  .btn-primary:active:not(:disabled) { opacity: 0.85; }
  .btn-secondary {
    padding: 13px 18px; background: transparent;
    border: 1px solid var(--border2); border-radius: 8px;
    color: var(--text4); font-size: 14px;
  }
  .btn-secondary:active { opacity: 0.7; }
  .btn-outline-gold {
    background: var(--bg2); border: 1px solid var(--gold);
    color: var(--gold); border-radius: 8px;
    padding: 9px 16px; font-size: 12px; letter-spacing: 0.5px;
    margin-bottom: 16px;
  }
  .btn-outline-gold:active { opacity: 0.7; }
  .btn-outline-gold:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-danger {
    padding: 13px 16px; background: transparent;
    border: 1px solid var(--red-border); border-radius: 8px;
    color: var(--red); font-size: 14px;
  }
  .btn-danger:active { opacity: 0.7; }

  /* ── VIEW SHEET ── */
  .view-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; color: var(--text); line-height: 1.3;
    margin-bottom: 10px; padding-right: 70px;
  }
  .view-source {
    color: var(--gold); font-size: 12px; word-break: break-all;
    margin-bottom: 14px; text-decoration: none; display: block;
  }
  .view-note {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 13px 15px;
    font-style: italic; color: var(--text2); font-size: 13px;
    line-height: 1.6; margin-bottom: 14px;
  }
  .view-body {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 13px 15px;
    color: var(--text3); font-size: 12px; line-height: 1.7;
    white-space: pre-wrap; max-height: 200px; overflow-y: auto;
    margin-bottom: 14px;
  }
  .view-date { font-size: 10px; color: var(--text5); margin-bottom: 20px; }

  /* ── AI BADGE ── */
  .ai-ok { font-size: 10px; color: #6a9a40; margin-left: 10px; letter-spacing: 0.5px; }
</style>
</head>

<div id="app"></div>

<script>
const TAGS = ["Breakfast","Lunch","Dinner","Snack","Dessert","Soup","Salad","Sides","Drinks","Baking"];
const STORAGE_KEY = "recipe-vault-v1";

// ── STATE ──
let state = {
  recipes: [],
  modal: null,        // null | 'add' | {type:'view'|'edit', id}
  search: "",
  filterTag: null,
  filterMade: false,
  sortBy: "newest",
  // add/edit form
  form: null,
  aiLoading: false,
  aiUsed: false,
};

const SEED_RECIPES = [
  {id:"r001",title:"Protein Sugar Cookies with Pink Icing",tags:["Baking","Dessert"],rating:0,quickNote:"Cookie: flour, whey/casein protein, low-cal butter, Swerve, cornstarch, baking powder, almond extract, salt, low-cal milk. Icing: zero-cal powdered sugar, splash milk, pink/red gel coloring. Mix dry, add butter, add milk 1 tbsp at a time. Form 8 balls, flatten on parchment, bake. Ice when cooled.",source:"@TheSamPlan on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000001000,updatedAt:1700000001000},
  {id:"r002",title:"Protein Pancakes (Greek Yogurt)",tags:["Breakfast"],rating:0,quickNote:"100g eggs, 240g Greek yogurt, 43g maple syrup, 5g vanilla, 68g vanilla whey, 60g flour, 8g baking powder, 1.5g salt. Mix and cook on griddle.",source:"",sourceType:"text",body:"2 large eggs (100g)\n240g Greek yogurt\n43g maple syrup\n5g vanilla extract\n68g vanilla whey protein powder\n60g all-purpose flour\n8g baking powder\n1.5g salt\nCooking spray",made:false,createdAt:1700000002000,updatedAt:1700000002000},
  {id:"r003",title:"Cottage Cheese Protein Pancakes",tags:["Breakfast"],rating:0,quickNote:"2 eggs, 1 cup cottage cheese, 2 tbsp maple syrup, 1 tsp vanilla, 2 scoops vanilla whey (34g/scoop), 1/2 cup flour, 2 tsp baking powder, 1/4 tsp salt. Cook on griddle.",source:"madaboutfood.co",sourceType:"link",body:"",made:false,createdAt:1700000003000,updatedAt:1700000003000},
  {id:"r004",title:"High Protein Biscuits",tags:["Breakfast","Baking"],rating:0,quickNote:"2 cups FMF, 1 cup cottage cheese, 1/4 cup Greek yogurt, 2 eggs, 1.5 tsp baking powder, 1/2 tsp salt. Makes 8. @hopewellheights",source:"@hopewellheights on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000004000,updatedAt:1700000004000},
  {id:"r005",title:"High Protein Blondies",tags:["Baking","Dessert"],rating:0,quickNote:"Wet: 113g nonfat Greek yogurt, 1 egg, 48ml egg white, 4.2ml vanilla. Dry: 60g flour, 1 scoop vanilla protein, 30g oat flour, 96g Swerve, 4g baking soda, 1g salt. Mix-ins: 21g choc chips. Bake 177°C 15 min. Cut into 88 blondies — 7 cal / 0.75g protein each!",source:"",sourceType:"text",body:"",made:false,createdAt:1700000005000,updatedAt:1700000005000},
  {id:"r006",title:"High Protein Mac & Cheese",tags:["Dinner"],rating:0,quickNote:"~30g protein per serving. Blend cottage cheese, cheddar, milk, cornstarch & spices until smooth. Pour over cooked protein pasta. Optional: breadcrumb topping, bake 177°C 15-20 min.",source:"",sourceType:"text",body:"1 box (411g) Barilla protein macaroni\n1.5 cups full-fat cottage cheese\n2 cups shredded cheddar\n1 cup whole milk\n1 tbsp cornstarch\n1/2 tsp ground mustard\n1/2 tsp onion powder\n1/2 tsp garlic powder\n1/2 tsp salt\n1/4 tsp black pepper\nOptional topping: 1/4 cup panko, 1/4 cup Italian breadcrumbs, 3 tbsp melted butter",made:false,createdAt:1700000006000,updatedAt:1700000006000},
  {id:"r007",title:"High Protein Crêpes",tags:["Breakfast"],rating:0,quickNote:"40g protein, 13g fiber per serving. Batter: 80g oat flour, 1 egg, 180g egg whites, 85g 0% Greek yogurt, almond milk, zero-cal maple syrup, vanilla, butter. Serve with yogurt, nut butter, berries.",source:"",sourceType:"text",body:"Batter (4 crêpes): 80g oat flour, 1 whole egg, 180g egg whites, 85g plain 0% Greek yogurt, 1/4 cup unsweetened almond milk, 1.5 tbsp zero-calorie maple syrup, 1/2 tsp vanilla, 2 tsp butter.\nServe: 150g 0% Greek yogurt, 10g nut butter, 100g raspberries + 100g blueberries",made:false,createdAt:1700000007000,updatedAt:1700000007000},
  {id:"r008",title:"Peanut Butter Oat Crust Dessert Bars",tags:["Dessert","Baking"],rating:0,quickNote:"Crust: oat flour, PB, maple syrup, coconut oil, salt. Filling: PB, cream cheese, maple syrup, whipped cream, salt. Press crust in dish, fridge 30 min. Spread filling, freeze 1+ hr. Slice 8 squares.",source:"sammibrondo.com",sourceType:"link",body:"Crust: 1.5 cup oat flour, 1/4 cup PB, 2 tbsp maple syrup, 2 tbsp melted coconut oil, salt\nFilling: 3/4 cup PB, 225g cream cheese (softened), 1/4 cup maple syrup, 1 cup whipped cream, salt",made:false,createdAt:1700000008000,updatedAt:1700000008000},
  {id:"r009",title:"Peanut Butter Chocolate Shortbread Cookies",tags:["Baking","Dessert"],rating:0,quickNote:"Beat butter + PB until creamy. Add sugars, vanilla, flour. Form logs, refrigerate 30-60 min. Slice, bake 177°C 20 min. Dip in chocolate when cooled.",source:"howsweeteats.com",sourceType:"link",body:"",made:false,createdAt:1700000009000,updatedAt:1700000009000},
  {id:"r010",title:"Dump & Bake High Protein Ramen",tags:["Dinner"],rating:0,quickNote:"47g protein per serving. Whisk broth, coconut milk, PB, red curry paste, coconut aminos, sesame oil, garlic in baking dish. Add ramen + edamame. Cover, bake 177°C 20 min. Uncover, add chicken, bake 5 more. Serve with soft-boiled egg, sesame seeds, lime, chili oil.",source:"@alectreffs",sourceType:"text",body:"2 cups chicken bone broth, 1 can lite coconut milk, 2 tbsp creamy PB, 1 tbsp red curry paste, 1 tbsp coconut aminos, 1 tsp sesame oil, 1 garlic clove minced, 1 pack Lotus Foods ramen, shredded chicken, edamame, soft-boiled egg",made:false,createdAt:1700000010000,updatedAt:1700000010000},
  {id:"r011",title:"Ninja Creami Chocolate PB Ice Cream",tags:["Dessert"],rating:0,quickNote:"37g protein. Mix 1 chocolate truffle iconic protein drink, 85g Siggi's 0% yogurt, 2 tbsp powdered PB, 2 tbsp chocolate instant pudding. Froth, freeze overnight. Spin on ice cream setting, add 2 tbsp milk, re-spin. Mix in cacao nibs.",source:"@alectreffs",sourceType:"text",body:"",made:false,createdAt:1700000011000,updatedAt:1700000011000},
  {id:"r012",title:"Cheesy Beef Pasta Meal Prep",tags:["Dinner"],rating:0,quickNote:"10 servings. Cook 3lbs 96/4 beef with garlic powder, onion powder, salt/pepper. Steam 455g broccoli. Boil 455g protein pasta. Blend cheese sauce: 300g Greek yogurt, 300g cottage cheese, 240ml bone broth, garlic, seasonings, cornstarch, Mexican cheese. Combine all, portion into 10 containers.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000012000,updatedAt:1700000012000},
  {id:"r013",title:"No-Bake Cookie Dough Bites",tags:["Dessert","Snack"],rating:0,quickNote:"Cookie dough: almond flour, maple syrup, coconut oil, vanilla, mini choc chips. PB layer: PB, coconut oil, maple syrup. Chocolate: mini choc chips + coconut oil melted. Layer in ice cube tray, freeze 2 hrs. Top with flaky salt.",source:"@kalejunkie on Facebook",sourceType:"text",body:"Cookie dough: 1 3/4 cups almond flour, 1/4 cup maple syrup, 1/4 cup melted coconut oil, 2 tsp vanilla, 1 cup mini choc chips\nPB layer: 1 cup PB, 2 tsp coconut oil, 2 tbsp maple syrup\nChocolate: 1 cup mini choc chips + 2 tsp coconut oil",made:false,createdAt:1700000013000,updatedAt:1700000013000},
  {id:"r014",title:"High Protein Ground Beef Mongolian Noodles",tags:["Dinner"],rating:0,quickNote:"60g protein per serving. Cook 680g 93% lean beef. Add garlic, ginger, green onions, brown sugar, beef broth, hoisin, soy sauce. Thicken with cornstarch slurry. Toss with cooked linguine.",source:"@ice.karimcooks on Instagram",sourceType:"text",body:"225g linguine, 680g 93% lean ground beef, 6 cloves garlic minced, 4 tsp grated ginger, 4 green onions, 3 tbsp brown sugar, 1/2 cup low-sodium beef broth, 3 tbsp hoisin sauce, 1/2 cup low-sodium soy sauce, 1 tbsp cornstarch + 1/4 cup water",made:false,createdAt:1700000014000,updatedAt:1700000014000},
  {id:"r015",title:"3-Ingredient Protein Cookies",tags:["Baking","Snack"],rating:0,quickNote:"1 ripe banana (~100g), 60g natural PB, 40g PB2 mixed with water (or 125g PB original). Makes 6 cookies. 138-173 cal / 13-13.5g protein each.",source:"@mattwest_roadtoaesthetics on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000015000,updatedAt:1700000015000},
  {id:"r016",title:"Cottage Cheese Flatbread",tags:["Breakfast","Sides"],rating:0,quickNote:"1 cup flour, 2 tsp baking powder, pinch salt, 1 cup + 2 tbsp cottage cheese (2% or 4%). Mix, cook on pan or bake.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000016000,updatedAt:1700000016000},
  {id:"r017",title:"Maple Yogurt Breakfast Oatmeal Cookies",tags:["Breakfast","Baking"],rating:0,quickNote:"Soft, protein-boosted, not too sweet. Makes 10-12.",source:"",sourceType:"text",body:"120g whole milk Greek yogurt, 80g maple syrup, 1 large egg, 60g melted butter, 1 tsp vanilla, 120g rolled oats, 80g flour, 30g vanilla protein powder, 1 tsp baking powder, 1/2 tsp cinnamon, 1/4 tsp salt, 60g chocolate chips (optional)",made:false,createdAt:1700000017000,updatedAt:1700000017000},
  {id:"r018",title:"Greek Yogurt Soft Serve — Chocolate & PB Versions",tags:["Dessert","Snack"],rating:0,quickNote:"Chocolate: 250g Greek yogurt, 1 scoop choc whey, 10g cocoa powder, 15g maple syrup, 120ml milk — tastes like choc soft serve. PB Cup: 250g Greek yogurt, 1 scoop vanilla whey, 1 tbsp PB, 15g maple syrup, milk to blend. Blend all and serve.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000018000,updatedAt:1700000018000},
  {id:"r019",title:"Chocolate Banana Bread",tags:["Baking"],rating:0,quickNote:"240g very ripe bananas, 170g 2% Greek yogurt, 1 egg, 60g vegetable oil, 60g whole milk, 5g vanilla, 132g sugar, 13g brown sugar, 10-12g cocoa powder, 3g salt, 6g baking soda, 200g flour, optional choc chips.",source:"forkknifeswoon.com",sourceType:"link",body:"",made:false,createdAt:1700000019000,updatedAt:1700000019000},
  {id:"r020",title:"Slow Cooker Chicken Enchilada Pasta",tags:["Dinner"],rating:0,quickNote:"225g low carb pasta, 2-3 chicken breasts, 1 block cream cheese, 1 can enchilada sauce, 1 cup Mexican cheese, 1 cup diced peppers & onions. Cook all except cheese and pasta in slow cooker on high 3 hrs. Shred chicken, add pasta and cheese.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000020000,updatedAt:1700000020000},
  {id:"r021",title:"High Protein Lasagna",tags:["Dinner"],rating:0,quickNote:"Meat sauce: 1360g 93% ground beef, onions, olive oil, tomato paste, bone broth, marinara, seasonings, optional white miso. Cheese filling: 900g cottage cheese, 2 eggs, mozzarella, parmesan, parsley. Layer with 455g lasagna noodles. Bake covered 190°C 40 min, broil 10-15 min. Makes 10 slices.",source:"@stealth_health on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000021000,updatedAt:1700000021000},
  {id:"r022",title:"Cottage Cheese Cookie Dough Bites",tags:["Dessert","Snack"],rating:0,quickNote:"1 cup cottage cheese, 1/3 cup almond or PB, 2-3 tbsp maple syrup or honey, 1 tsp vanilla, 3/4 cup oat flour, 1/4 cup mini choc chips, pinch salt. Mix and chill or bake.",source:"cookibly.com",sourceType:"link",body:"",made:false,createdAt:1700000022000,updatedAt:1700000022000},
  {id:"r023",title:"Creamy Chicken & Potato Sheet Pan",tags:["Dinner"],rating:0,quickNote:"Season chicken with Italian herbs, garlic, onion powder, paprika, olive oil. Bake potatoes + red onion 200°C 20-22 min. Add chicken over potatoes, bake 25 more min. Pour milk + garlic herb cream cheese + mozzarella over top — residual heat melts everything. Garnish with parsley.",source:"",sourceType:"text",body:"800g chicken breast + 800g chicken thighs (cubed), 1600g raw potatoes (cubed), 400g red onion, 400-450ml milk, 250g garlic herb cream cheese, 120g shredded mozzarella, seasonings",made:false,createdAt:1700000023000,updatedAt:1700000023000},
  {id:"r024",title:"Protein Crêpes — 3 Egg Version",tags:["Breakfast"],rating:0,quickNote:"Makes 6-8. Blend 3 eggs + 180g whole milk. Add 60g flour, 20-25g protein powder, 1g salt, optional vanilla. Blend. Add 10g melted butter + optional maple syrup. Cook in buttered pan.",source:"",sourceType:"text",body:"3 large eggs, 180g whole milk, 60g all-purpose flour, 20-25g protein powder, 10g melted butter, 10-15g maple syrup (optional), 1g salt, 2g vanilla (optional)",made:false,createdAt:1700000024000,updatedAt:1700000024000},
  {id:"r025",title:"Tuna Rangoon Dip",tags:["Lunch","Snack"],rating:0,quickNote:"360 cal + 50g protein per serving (3 servings). Mix tuna, Laughing Cow wedges, mozzarella, sriracha, sesame oil, lemon juice, cottage cheese, garlic powder, green onions, sweet chili sauce. Top with reserved cheese + onions + sesame seeds. Bake 200°C 15 min, broil until golden. Serve with roasted seaweed.",source:"",sourceType:"text",body:"2 cans (12oz) tuna, 8 light Laughing Cow wedges, 140g light mozzarella, 3 tbsp sriracha, 1 tsp sesame oil, 2 tbsp lemon juice, 1/4 cup low-fat cottage cheese, garlic powder, salt, 4 green onions, 1/5 cup G Hughes sweet chili sauce, sesame seeds",made:false,createdAt:1700000025000,updatedAt:1700000025000},
  {id:"r026",title:"Slow Cooker Orange Chili Crisp Chicken",tags:["Dinner"],rating:0,quickNote:"1800g chicken thighs + orange juice, soy sauce, mirin, chili crisp, garlic powder, onion powder, black pepper. Cook high 3-4 hrs or low 4-5 hrs. Reduce liquid 20 min. Orange sauce: marmalade, chili crisp, rice vinegar, honey, ginger. Thicken with cornstarch slurry. Makes 10 servings over rice.",source:"",sourceType:"text",body:"1800g boneless skinless chicken thighs, 240ml orange juice, 90g soy sauce, 45g mirin, 15g chili crisp\nOrange sauce: 120g orange marmalade, 30g chili crisp, 30g rice vinegar, 20g honey, 10g ginger paste",made:false,createdAt:1700000026000,updatedAt:1700000026000},
  {id:"r027",title:"Chocolate Bars — 3 Ingredient",tags:["Dessert","Snack"],rating:0,quickNote:"1/2 cup coconut oil melted, 1/2 cup honey, 3/4 cup cocoa powder. Mix well, pour into molds. Keep refrigerated. @HuttonGirlsHomestead",source:"@HuttonGirlsHomestead on Facebook",sourceType:"text",body:"",made:false,createdAt:1700000027000,updatedAt:1700000027000},
  {id:"r028",title:"Sourdough Dinner Rolls",tags:["Baking","Sides"],rating:0,quickNote:"28g butter, 240g milk, 44g sugar (or 2 tbsp honey), 5g salt, 100g active sourdough starter, 375g bread flour, 1 tbsp melted butter for brushing after baking. Full recipe at littlespoonfarm.com",source:"littlespoonfarm.com",sourceType:"link",body:"",made:false,createdAt:1700000028000,updatedAt:1700000028000},
  {id:"r029",title:"Overnight Sourdough Bread",tags:["Baking"],rating:0,quickNote:"100g cold starter, 370g water, 500g flour, 12g salt. Mix starter + water, add flour, rest 30 min, add salt + splash water. Stretch & fold every 30 min x3. Bulk ferment overnight 10 hrs. Shape, fridge 1-5 hrs. Bake 230°C with lid 30 min, 200°C without lid 15 min.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000029000,updatedAt:1700000029000},
  {id:"r030",title:"Cottage Cheese Dutch Baby",tags:["Breakfast"],rating:0,quickNote:"120g cottage cheese, 3 eggs, 60g flour (or 40g flour + 20g oat flour), 120g whole milk, 15g butter for pan, pinch salt. Optional sweet: 1/2 tsp vanilla + honey. Preheat oven 220°C, melt butter in skillet in oven. Blend all except butter, pour into hot pan. Bake 18-22 min until puffed and golden.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000030000,updatedAt:1700000030000},
  {id:"r031",title:"Homemade Playdough (Hot Water Method)",tags:[],rating:0,quickNote:"NOT EDIBLE — for kids! 250g flour, 125g salt, 30g cream of tartar, 30ml vegetable oil, 240ml hot water, food coloring. Mix dry, stir in oil, add hot water with coloring, stir until dough forms, knead until smooth. Stores 6 months in airtight container.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000031000,updatedAt:1700000031000},
  {id:"r032",title:"Banana Oat Cookies with Structure",tags:["Baking","Breakfast"],rating:0,quickNote:"Makes 12. 200g ripe banana, 1 egg, 60g melted butter, 80g flour, 120g rolled oats, 50g sugar (optional), 1/2 tsp baking powder, 1/2 tsp cinnamon, 1/4 tsp salt. Optional: choc chips, nuts, chia, raisins. Bake 175°C 12-14 min.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000032000,updatedAt:1700000032000},
  {id:"r033",title:"Homemade Marshmallows — Weston Price",tags:["Dessert"],rating:0,quickNote:"1/3 cup cold water, 2 tbsp gelatin, 2/3 cup maple syrup, 1 tsp vanilla, 1/4 tsp salt. Bloom gelatin, heat to dissolve. Mix maple syrup + vanilla + salt in stand mixer on low, slowly add gelatin, increase to high 5 min until thick white peaks. Spread in parchment pan, set 2-3 hrs, cut and coat in powdered sugar.",source:"@westonaprice",sourceType:"text",body:"",made:false,createdAt:1700000033000,updatedAt:1700000033000},
  {id:"r034",title:"Pumpkin Cookies — Sugar-Free with Lakanto",tags:["Baking","Dessert"],rating:0,quickNote:"Soft and fluffy. 120g softened butter, 150g Lakanto, 1 egg, 180g pumpkin purée, 5g vanilla, 240g flour, baking powder, baking soda, salt, cinnamon, pumpkin pie spice. Optional: dark choc chips, pecans, cranberries.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000034000,updatedAt:1700000034000},
  {id:"r035",title:"Sourdough English Muffins",tags:["Breakfast","Baking"],rating:0,quickNote:"Makes 18. 200g starter, 2 tbsp honey, 480g warm milk, 10g salt, 720g bread flour, cornmeal for dusting. Mix everything, rest, let sit 5 hrs. Divide into 80g balls. Rise 2 hrs. Cook 190°C — 11 min per side.",source:"@DanicaRecipes on Facebook",sourceType:"text",body:"",made:false,createdAt:1700000035000,updatedAt:1700000035000},
  {id:"r036",title:"Oat Flour Shortbread (Healthy)",tags:["Baking","Dessert"],rating:0,quickNote:"120g oat flour, 50g softened butter, 40g sugar or maple syrup, 1/2 tsp vanilla. Mix, press into small pan, bake 165°C 18-20 min.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000036000,updatedAt:1700000036000},
  {id:"r037",title:"Savory Oat Flour Cheese Biscuits",tags:["Breakfast","Sides","Baking"],rating:0,quickNote:"120g oat flour, 1 egg, 50g shredded cheese. Mix and cook. Simple and surprisingly delicious.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000037000,updatedAt:1700000037000},
  {id:"r038",title:"Greek Yogurt Protein Pancakes (No Powder)",tags:["Breakfast"],rating:0,quickNote:"Makes 6 small, 26-30g protein total. 200g Greek yogurt, 1 egg, 40g oat flour, 20g AP flour, 15g maple syrup, 2g baking powder, pinch salt, butter for pan. Whisk yogurt + egg + syrup. Add dry ingredients. Cook on medium-low.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000038000,updatedAt:1700000038000},
  {id:"r039",title:"Homemade Marshmallows — Egg White Version",tags:["Dessert"],rating:0,quickNote:"6-8 egg whites, pinch sea salt, 1/3 cup warm water, 1 tbsp gelatin, 1/2 cup sweetener (honey/maple/rapadura), 1 tsp vanilla. Bloom gelatin. Whisk whites until frothy. Heat sweetener + vanilla on med-low until dissolved. Slowly pour into whites while beating. Mix 5 min until thick. Spread in lined pan, fridge 1+ hr. Slice and store in fridge up to a week.",source:"thehomeylif3.com",sourceType:"link",body:"",made:false,createdAt:1700000039000,updatedAt:1700000039000},
  {id:"r040",title:"Cheesy Garlic Butter Naan",tags:["Sides","Baking"],rating:0,quickNote:"Makes 10. ~300 cal / 30g protein each. 500g self-rising flour, 520g 0% Greek yogurt, 30g garlic salt, 560g fat-free mozzarella, 60g melted light butter, 40g minced garlic, 10g fresh parsley. Mix flour + yogurt for dough, top with garlic butter + cheese + parsley. Cook in pan or air fry. Freeze up to 3 months.",source:"@fairfiteats on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000040000,updatedAt:1700000040000},
  {id:"r041",title:"Hidden Veggie Chocolate Muffins",tags:["Breakfast","Baking","Snack"],rating:0,quickNote:"Dry: 1.5 cups whole wheat flour, 1/3 cup Dutch cocoa powder, baking powder, baking soda, salt, mini choc chips. Wet: 1 cup grated carrots, 1 cup grated zucchini, 1 cup baby spinach, 1/2 cup Greek yogurt, 1/2 cup honey, 1/4 cup avocado oil, 2 eggs, 1 tsp vanilla. Bake 175°C in muffin pan.",source:"survivingnotthriving.substack.com",sourceType:"link",body:"",made:false,createdAt:1700000041000,updatedAt:1700000041000},
  {id:"r042",title:"Homemade Beef Summer Sausage",tags:["Snack"],rating:0,quickNote:"900g 80-85% ground beef, 2 tbsp Morton Tender Quick Salt, 1/2 tsp garlic powder, 1 tbsp mustard seed, 2-3 tsp coarse pepper, 1 tbsp liquid smoke, 1 tbsp granulated sugar. Mix, form into logs, wrap tightly, refrigerate 24 hrs. Bake 135°C 2 hrs. Cool in fridge. Keeps 1 week fridge / 3 months frozen.",source:"@homebeginswithlove on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000042000,updatedAt:1700000042000},
  {id:"r043",title:"Classic Waffles",tags:["Breakfast"],rating:0,quickNote:"120g flour, 8g baking powder, 2g salt, 1 egg, 120g whole milk, 20g melted butter, 10-15g maple syrup or sugar. Whisk dry, whisk wet, combine. Cook in waffle maker on medium heat.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000043000,updatedAt:1700000043000},
  {id:"r044",title:"Funfetti Yogurt Edible Cookie Dough / Cloud Cookies",tags:["Dessert","Baking"],rating:0,quickNote:"120g heat-treated flour, 60g softened butter, 60g plain yogurt, 50g maple syrup, 40g white sugar, 1 tsp vanilla, pinch salt, sprinkles. Cream butter + sugar + maple syrup. Add yogurt + vanilla. Mix in flour + salt. Fold in sprinkles. Chill 20-30 min for edible dough. Or bake 175°C 9-11 min for soft cakey cookies.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000044000,updatedAt:1700000044000},
  {id:"r045",title:"Maple Chocolate Chip Shortbread Cookies",tags:["Baking","Dessert"],rating:0,quickNote:"150g flour, 25g white sugar, 25g maple syrup, 115g soft unsalted butter, 1/4 tsp salt, 60g mini choc chips, 1 tsp vanilla. Beat butter + sugar, add maple + vanilla, add flour + salt, fold in chips. Shape into log, chill 10 min. Bake 165°C 13-15 min. Cool completely.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000045000,updatedAt:1700000045000},
  {id:"r046",title:"Pumpkin Chocolate Chip Scones",tags:["Baking","Breakfast"],rating:0,quickNote:"1 cup AP flour, 1 cup whole wheat pastry flour, cinnamon, ginger, nutmeg, 1/3 cup sugar, baking powder, baking soda, 1/2 cup frozen salted butter, 1/2 cup canned pumpkin, 1 egg, 1 cup mini choc chips, coarse sugar on top. Full recipe at somewhatsimple.com",source:"somewhatsimple.com",sourceType:"link",body:"",made:false,createdAt:1700000046000,updatedAt:1700000046000},
  {id:"r047",title:"Cottage Cheese Alfredo Sauce",tags:["Dinner","Sides"],rating:0,quickNote:"~110 cal per 1/4 cup, makes 2 cups. 225g cottage cheese, 60ml milk, 10g butter, 15g Parmesan, 2g garlic, 1/2 tsp salt, 1/4 tsp pepper, pinch nutmeg. Blend cottage cheese + milk + Parmesan + seasonings smooth. Sauté garlic in butter 30-60 sec. Add sauce, heat gently on low 3-5 min. Don't boil.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000047000,updatedAt:1700000047000},
  {id:"r048",title:"French Onion Cottage Cheese Sauce",tags:["Sides"],rating:0,quickNote:"150g cottage cheese, 1 small caramelized onion (~50g), 1 tsp Worcestershire or coconut aminos, salt, pepper, splash of broth. Blend smooth. Amazing on steak, chicken, or baked potatoes.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000048000,updatedAt:1700000048000},
  {id:"r049",title:"Spicy Chipotle Cottage Cheese Sauce",tags:["Sides","Snack"],rating:0,quickNote:"150g cottage cheese, 1 chipotle in adobo (or 1/2 tsp chipotle powder), 1/2 clove garlic. Blend smooth. Smoky, spicy, tangy.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000049000,updatedAt:1700000049000},
  {id:"r050",title:"Cheesy Biscuit Chaffles",tags:["Breakfast","Snack"],rating:0,quickNote:"Makes 4-6 mini or 2 large. 2 large eggs, 60g shredded cheddar, 48g almond flour (or 1/2 cup regular flour), 1 tsp baking powder, 2 tbsp melted butter, 1/4 tsp salt. Optional: garlic powder, onion powder, chives or bacon bits. Whisk together and cook in waffle maker.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000050000,updatedAt:1700000050000},
  {id:"r051",title:"Thick Chocolate Chip Cookies — Freezer Method",tags:["Baking","Dessert"],rating:0,quickNote:"Makes 9 large. 200g melted butter, 200g light brown sugar, 50g caster sugar, 2 eggs, 400g self-raising flour, 1 tsp vanilla, 350g dark chocolate chunks, flaky sea salt. Mix butter + sugars, add eggs + vanilla, fold in flour, add chocolate. Roll 140g balls, freeze 2+ hrs. Bake from frozen 180°C 15-20 min.",source:"@fromscratchhwithbob on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000051000,updatedAt:1700000051000},
  {id:"r052",title:"Fluffy Custard Waffles",tags:["Breakfast"],rating:0,quickNote:"4 eggs (separated), 40g melted butter, 25g maple syrup, 1 tsp vanilla, 50g milk or cream, 75g flour, 1/2 tsp baking powder, pinch salt. Whip whites to soft peaks. Whisk yolks + butter + syrup + vanilla + milk. Add flour + baking powder + salt. Fold in whites. Cook in waffle iron.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000052000,updatedAt:1700000052000},
  {id:"r053",title:"Greek Yogurt & Butter Protein Waffles",tags:["Breakfast"],rating:0,quickNote:"Makes 4, ~13g protein each. 2 eggs, 200g full-fat Greek yogurt, 100g flour, 1 tsp baking powder, 20g melted butter, 1 tsp vanilla, pinch salt, 15g maple syrup (optional). Whisk wet, add dry, rest 5 min, cook 3-4 min in hot waffle iron.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000053000,updatedAt:1700000053000},
  {id:"r054",title:"High-Protein Greek Yogurt Blondies",tags:["Baking","Dessert"],rating:0,quickNote:"Makes 9 squares. 120g Greek yogurt, 75ml maple syrup, 1 egg, 1 tsp vanilla, 45g flour, 30g vanilla protein powder, 1/2 tsp baking powder, 1/4 tsp salt, 30g melted butter, optional choc chips. Whisk wet, add dry gently, fold in chips. Bake 175°C 18-22 min in 20x20cm pan. Cool completely before cutting.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000054000,updatedAt:1700000054000},
  {id:"r055",title:"Chocolate Baked Oats for Kids",tags:["Breakfast","Dessert"],rating:0,quickNote:"Serves 1-2. 1/2 cup oats, 1/2 banana, 1 egg, 1/4 cup milk, pinch salt, 1/4 tsp baking soda, handful choc chips. Blend everything except choc chips. Pour into ramekin, top with chips. Bake 175°C 20-25 min.",source:"@Thegeelife on Facebook",sourceType:"text",body:"",made:false,createdAt:1700000055000,updatedAt:1700000055000},
  {id:"r056",title:"Lebanese Garlic & Lemon Salad",tags:["Salad","Sides"],rating:0,quickNote:"1 head lettuce (chopped), 1 head garlic (chopped). Soak lettuce in salted water briefly, drain. Toss with garlic. Dressing: generous olive oil, juice of 2 whole lemons, salt. Serve alongside any meal or in pita.",source:"@sivanskitchen on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000056000,updatedAt:1700000056000},
  {id:"r057",title:"Pumpkin Quick Bread with Maple & Yogurt",tags:["Baking"],rating:0,quickNote:"250g flour, 1 tsp baking soda, 1 tsp baking powder, 1/2 tsp salt, 2 tsp cinnamon, 1/2 tsp nutmeg, 1/2 tsp ginger, optional cloves, 2 eggs, 120g full-fat Greek yogurt, 120ml neutral oil, 160ml maple syrup, 250g pumpkin purée, 2 tsp vanilla. Combine dry, whisk wet, fold together, bake 175°C in loaf pan.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000057000,updatedAt:1700000057000},
  {id:"r058",title:"Oatmeal Breakfast Bars with Maple & Greek Yogurt",tags:["Breakfast","Baking"],rating:0,quickNote:"Makes 12. 200g rolled oats, 120g whole wheat flour, 1 tsp baking powder, 1/2 tsp baking soda, 1/2 tsp cinnamon, 1/4 tsp salt, 150g Greek yogurt, 120g maple syrup, 1 egg, 60g melted butter, 1 tsp vanilla, optional 80g add-ins. Bake 175°C in 20x20cm pan.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000058000,updatedAt:1700000058000},
  {id:"r059",title:"Chewy Maple Yogurt Oatmeal Cookies",tags:["Baking","Dessert"],rating:0,quickNote:"100g rolled oats, 125g flour, 1/2 tsp baking soda, 1/2 tsp cinnamon, pinch salt, 80ml maple syrup, 60g Greek yogurt, 60g melted butter, 1 egg, 1 tsp vanilla, optional raisins/nuts. Mix dry, whisk wet, combine. Drop spoonfuls, flatten, bake 175°C 10-12 min.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000059000,updatedAt:1700000059000},
  {id:"r060",title:"NYC-Style Gooey Center Cookies",tags:["Baking","Dessert"],rating:0,quickNote:"Makes 12. 260g flour, 1 tsp baking soda, 1/2 tsp salt, 115g melted butter, 150g brown sugar, 100g white sugar, 1 egg + 1 yolk, 2 tsp vanilla, 200g choc chips. Whisk flour + soda + salt. Mix butter + sugars until glossy. Add eggs + vanilla. Fold in dry + choc. Chill 1 hr. Bake 180°C 10-12 min. Pull when centers soft.",source:"Chef Sanjaya on Facebook",sourceType:"text",body:"",made:false,createdAt:1700000060000,updatedAt:1700000060000},
  {id:"r061",title:"No-Bake Kodiak PB Oat Bites",tags:["Snack","Baking"],rating:0,quickNote:"1 cup Kodiak Cakes mix, 1/2 cup old fashioned oats, 1 cup creamy PB, 1/2 cup raw honey, 1 tsp vanilla, 1/4-1/2 cup mini choc chips. Optional: salt, cinnamon, flax, chia, protein powder, rice krispies. Mix everything, roll into balls or press on lined sheet. Chill until firm.",source:"iheartnaptime.net",sourceType:"link",body:"",made:false,createdAt:1700000061000,updatedAt:1700000061000},
  {id:"r062",title:"Pumpkin Protein Bars",tags:["Baking","Snack"],rating:0,quickNote:"Makes 12, moist and lightly cakey. Dry: 150g flour, 40g vanilla protein powder, 40g brown/coconut sugar, 5g baking powder, 2g baking soda, 1.5 tsp pumpkin spice, 1/2 tsp cinnamon, 1/4 tsp salt. Wet: 240g pumpkin purée, 2 eggs, 90g maple syrup, 70g melted butter, 5g vanilla. Bake 175°C.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000062000,updatedAt:1700000062000},
  {id:"r063",title:"Easy Teriyaki Sauce (Small Batch)",tags:["Sides"],rating:0,quickNote:"60g soy sauce or tamari, 40g honey or maple syrup, 15g rice vinegar, 1 tsp fresh grated ginger (or 1/2 tsp ground), 1 small garlic clove grated, 30g water. Optional: 1 tsp cornstarch + 1 tbsp cold water to thicken. Simmer 2-3 min, add slurry if desired.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000063000,updatedAt:1700000063000},
  {id:"r064",title:"Banana Protein Pancakes",tags:["Breakfast"],rating:0,quickNote:"2 ripe bananas (well mashed), 240g full-fat Greek yogurt, 2 large eggs, 60g maple syrup, 10g vanilla, 180g flour (AP or einkorn), 8g baking powder, 2g salt, butter or ghee for cooking.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000064000,updatedAt:1700000064000},
  {id:"r065",title:"Strawberry Frozen Yogurt / Protein Smoothie Bowl",tags:["Breakfast","Dessert","Snack"],rating:0,quickNote:"Per serving (4 total): 162g frozen strawberries, 133g Greek yogurt, 17.5g protein powder, 1 egg yolk, 96g milk. ~314 kcal / 34.8g protein / 24.3g carbs / 9.8g fat per serving.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000065000,updatedAt:1700000065000},
  {id:"r066",title:"Slow Cooker Chili Chicken",tags:["Dinner"],rating:0,quickNote:"680g boneless skinless chicken breast, 240ml low-sodium chicken broth, 1 tbsp dark chili powder, 1 tsp cumin, 1 tsp smoked paprika, 1/2 tsp dried oregano, 1/2 tsp garlic powder, 1/2 tsp salt, 1/2 tsp black pepper. Full recipe at girlwiththeironcast.com",source:"girlwiththeironcast.com",sourceType:"link",body:"",made:false,createdAt:1700000066000,updatedAt:1700000066000},
  {id:"r067",title:"Brown Butter Oat Bars with Cinnamon Icing",tags:["Baking","Dessert"],rating:0,quickNote:"Bars: 1 cup brown butter, 1 cup sugar, 1 cup brown sugar, 2 eggs, 2 tbsp molasses, 1 tsp salt, 3.5 cups partially blended oats, 1 cup flour, 2.5 tsp baking soda, 1 tbsp cinnamon. Press in 9x13, bake 175°C 18-22 min. Icing: 1 cup powdered sugar, 1 tbsp butter, 1 tbsp vanilla, 1/4 tsp cinnamon, water. Cool before icing.",source:"@ourmidwestroots on Instagram",sourceType:"text",body:"",made:false,createdAt:1700000067000,updatedAt:1700000067000},
  {id:"r068",title:"Bone Broth Jasmine Rice",tags:["Sides"],rating:0,quickNote:"2.25 cups jasmine rice (rinsed), 3 tbsp butter or ghee, 6 cups bone broth. Bring to boil, cover, simmer ~20 min until absorbed. Fluff and season.",source:"thealmondeater.com",sourceType:"link",body:"",made:false,createdAt:1700000068000,updatedAt:1700000068000},
  {id:"r069",title:"Greek Yogurt Vanilla Dip / Base",tags:["Dessert","Snack"],rating:0,quickNote:"220g full-fat Greek yogurt (very thick), 35-45g maple syrup to taste, 1 tsp vanilla, pinch of salt. Mix all together. Use as dip, froyo base, or topping.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000069000,updatedAt:1700000069000},
  {id:"r070",title:"PB Skillet Cookie (Almond Butter Version)",tags:["Baking","Dessert"],rating:0,quickNote:"Serves 8. 2 eggs, 1/2 cup coconut sugar, 1/2 cup almond butter, 1 tsp vanilla, 1/2 cup almond flour, 1/2 tsp baking soda, 1/2 tsp salt, 1/2 cup choc chips, flaky salt, 1 scoop protein powder (25-30g). Preheat to 175°C, grease 8-inch skillet. Mix and bake 12-14 min.",source:"kelkooks.com",sourceType:"link",body:"",made:false,createdAt:1700000070000,updatedAt:1700000070000},
  {id:"r071",title:"PB Protein Skillet Cookie",tags:["Baking","Dessert"],rating:0,quickNote:"Serves 8. 100g brown sugar, 100g eggs, 128g creamy PB, 4g vanilla, 48g almond flour, 25-30g protein powder, 2.5g baking soda, 3g salt, 85g choc chips. Preheat 175°C, grease 8-inch skillet or baking dish. Mix and bake.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000071000,updatedAt:1700000071000},
  {id:"r072",title:"Gooey Crispy-Edge Greek Yogurt Cookies",tags:["Baking","Dessert"],rating:0,quickNote:"Makes 10-12. Chewy edges, gooey middle, NOT cakey. 80g softened butter, 40g Greek yogurt, 100g sugar (or 80-100g allulose for gooiest centers), 1 egg yolk, 2g vanilla, 2g salt, 2g baking soda, 140-150g flour, optional 80g choc chips or berries.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000072000,updatedAt:1700000072000},
  {id:"r073",title:"Spinach Artichoke Wrap (Alec Treffs WIEIAD)",tags:["Lunch"],rating:0,quickNote:"Mix filling ingredients together, divide into 2 servings. Scoop onto burrito-sized tortilla, top with shredded mozzarella, air fry 177°C 10 min. Save other half for lunch tomorrow! Ingredients include feta, Greek yogurt, artichoke, spinach.",source:"@alectreffs",sourceType:"text",body:"Filling: feta crumbled, ground pepper, garlic powder. Mix all together, divide into 2 servings. Scoop onto burrito-sized tortilla, top with more shredded mozzarella. Air fry at 350°F for 10 minutes.",made:false,createdAt:1700000073000,updatedAt:1700000073000},
  {id:"r074",title:"Cheesy Beef Broccoli Pasta (Ground Beef Version)",tags:["Dinner"],rating:0,quickNote:"3lbs 90/10 ground beef with garlic/onion powder, salt/pepper blend. 16oz broccoli steamed. 16oz protein pasta boiled. Cheese sauce: 300g Greek yogurt, 300g cottage cheese, 8oz bone broth, garlic, salt/pepper, onion powder, 35g cornstarch, 8oz Mexican cheese blend — blend smooth. Combine all.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000074000,updatedAt:1700000074000},
  {id:"r075",title:"Sourdough Starter Bread (Simple Method)",tags:["Baking"],rating:0,quickNote:"100g cold starter, 370g water, 500g flour, 12g salt. Mix, rest, add salt, stretch & fold x3. Bulk ferment overnight 10 hrs. Shape, cold proof 1-5 hrs. Bake 450°F with lid 30 min, 400°F without lid 15 min.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000075000,updatedAt:1700000075000},
  {id:"r076",title:"Peanut Butter Skillet Cookie (Metric)",tags:["Baking","Dessert"],rating:0,quickNote:"Serves 8. 100g brown sugar, 100g eggs (~2 large), 128g creamy PB, 4g vanilla, 48g almond flour, 25-30g protein powder, 2.5g baking soda, 3g salt, 85g choc chips. Preheat 175°C, grease 8-inch skillet. Bake.",source:"",sourceType:"text",body:"",made:false,createdAt:1700000076000,updatedAt:1700000076000},

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state.recipes = JSON.parse(raw);
    } else {
      // First time load — seed with all recipes
      state.recipes = SEED_RECIPES;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.recipes));
    }
  } catch(e) {
    state.recipes = SEED_RECIPES;
  }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.recipes)); } catch(e) {}
}
function setState(patch) {
  Object.assign(state, patch);
  render();
}

// ── HELPERS ──
function isUrl(s) { return /^https?:\/\//i.test((s||"").trim()); }
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
}

function getFiltered() {
  return state.recipes
    .filter(r => {
      if (state.search) {
        const q = state.search.toLowerCase();
        if (!r.title.toLowerCase().includes(q) &&
            !(r.quickNote||"").toLowerCase().includes(q)) return false;
      }
      if (state.filterTag && !(r.tags||[]).includes(state.filterTag)) return false;
      if (state.filterMade && !r.made) return false;
      return true;
    })
    .sort((a,b) => {
      if (state.sortBy === "newest") return b.createdAt - a.createdAt;
      if (state.sortBy === "oldest") return a.createdAt - b.createdAt;
      if (state.sortBy === "rating") return (b.rating||0) - (a.rating||0);
      if (state.sortBy === "alpha") return a.title.localeCompare(b.title);
      return 0;
    });
}

// ── STARS ──
function renderStars(rating, interactive, onChange) {
  const div = document.createElement("div");
  div.className = "stars" + (interactive ? " interactive" : "");
  for (let i = 1; i <= 5; i++) {
    const s = document.createElement("span");
    s.className = "star" + (i <= rating ? " on" : "");
    s.textContent = "★";
    if (interactive) {
      s.addEventListener("click", () => onChange(i === rating ? 0 : i));
      s.addEventListener("mouseover", () => {
        div.querySelectorAll(".star").forEach((el,idx) => {
          el.className = "star interactive" + (idx < i ? " on" : "");
        });
      });
      s.addEventListener("mouseout", () => {
        div.querySelectorAll(".star").forEach((el,idx) => {
          el.className = "star interactive" + (idx < (onChange._rating||rating) ? " on" : "");
        });
      });
    }
    div.appendChild(s);
  }
  return div;
}

// ── TAG BADGE ──
function makeTag(label, active, onClick, extraClass) {
  const span = document.createElement("span");
  span.className = "tag" + (active ? " active" : "") + (extraClass ? " "+extraClass : "");
  span.textContent = label;
  if (onClick) span.addEventListener("click", onClick);
  return span;
}

// ── FORM STATE ──
function blankForm() {
  return { title:"", source:"", body:"", tags:[], rating:0, quickNote:"", made:false };
}

// ── AI AUTOFILL ──
async function autofill() {
  const f = state.form;
  if (!f.source && !f.body) return;
  setState({ aiLoading: true });
  try {
    const prompt = `Given this recipe source: "${f.source||""}"${f.body ? "\n\nText:\n"+f.body : ""}\n\nReturn ONLY a JSON object (no markdown, no backticks) with:\n- title: string\n- suggestedTags: array from [${TAGS.join(", ")}]\n- summary: string (1-2 sentences describing the dish)`;
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{role:"user", content: prompt}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||"").join("").trim();
    const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
    const newForm = { ...f };
    if (parsed.title && !newForm.title) newForm.title = parsed.title;
    if (parsed.suggestedTags?.length) newForm.tags = parsed.suggestedTags.filter(t=>TAGS.includes(t));
    if (parsed.summary && !newForm.quickNote) newForm.quickNote = parsed.summary;
    setState({ form: newForm, aiLoading: false, aiUsed: true });
  } catch(e) {
    setState({ aiLoading: false });
  }
}

// ── RENDER MODAL: ADD / EDIT ──
function renderFormSheet(isEdit) {
  const f = state.form;
  const frag = document.createDocumentFragment();

  const handle = document.createElement("div");
  handle.className = "sheet-handle";
  frag.appendChild(handle);

  const inner = document.createElement("div");
  inner.className = "sheet-inner";

  const title = document.createElement("div");
  title.className = "sheet-title";
  title.textContent = isEdit ? "Edit Recipe" : "Add Recipe";
  inner.appendChild(title);

  function field(labelTxt, el) {
    const lbl = document.createElement("label");
    lbl.className = "field-label";
    lbl.textContent = labelTxt;
    inner.appendChild(lbl);
    inner.appendChild(el);
  }

  // Source
  const srcEl = document.createElement("textarea");
  srcEl.className = "field-textarea";
  srcEl.rows = 2;
  srcEl.placeholder = "https://pinterest.com/... or paste recipe text";
  srcEl.value = f.source;
  srcEl.addEventListener("input", () => { state.form.source = srcEl.value; });
  field("LINK OR SOURCE TEXT", srcEl);

  // Body
  const bodyEl = document.createElement("textarea");
  bodyEl.className = "field-textarea";
  bodyEl.rows = 4;
  bodyEl.placeholder = "Paste full recipe, ingredients, or any extra notes...";
  bodyEl.value = f.body;
  bodyEl.addEventListener("input", () => { state.form.body = bodyEl.value; });
  field("RECIPE BODY (OPTIONAL)", bodyEl);

  // Autofill button
  if (!isEdit) {
    const aiRow = document.createElement("div");
    aiRow.style.marginBottom = "16px";
    const aiBtn = document.createElement("button");
    aiBtn.className = "btn-outline-gold";
    aiBtn.textContent = state.aiLoading ? "✦ Autofilling..." : "✦ Autofill with AI";
    aiBtn.disabled = state.aiLoading || (!f.source && !f.body);
    aiBtn.addEventListener("click", autofill);
    aiRow.appendChild(aiBtn);
    if (state.aiUsed) {
      const ok = document.createElement("span");
      ok.className = "ai-ok";
      ok.textContent = "✓ filled";
      aiRow.appendChild(ok);
    }
    inner.appendChild(aiRow);
  }

  // Title
  const titleEl = document.createElement("input");
  titleEl.className = "field-input";
  titleEl.placeholder = "e.g. Salmon with miso glaze";
  titleEl.value = f.title;
  titleEl.addEventListener("input", () => { state.form.title = titleEl.value; });
  field("RECIPE TITLE *", titleEl);

  // Tags
  const tagsLbl = document.createElement("label");
  tagsLbl.className = "field-label";
  tagsLbl.textContent = "CATEGORIES";
  inner.appendChild(tagsLbl);
  const tagsRow = document.createElement("div");
  tagsRow.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;";
  TAGS.forEach(tag => {
    const t = makeTag(tag, f.tags.includes(tag), () => {
      if (f.tags.includes(tag)) state.form.tags = f.tags.filter(x=>x!==tag);
      else state.form.tags = [...f.tags, tag];
      render();
    });
    tagsRow.appendChild(t);
  });
  inner.appendChild(tagsRow);

  // Rating
  const ratingLbl = document.createElement("label");
  ratingLbl.className = "field-label";
  ratingLbl.textContent = "YOUR RATING";
  inner.appendChild(ratingLbl);
  const ratingWrap = document.createElement("div");
  ratingWrap.style.marginBottom = "14px";
  const stars = renderStars(f.rating, true, (v) => { state.form.rating = v; render(); });
  ratingWrap.appendChild(stars);
  inner.appendChild(ratingWrap);

  // Quick note
  const noteEl = document.createElement("textarea");
  noteEl.className = "field-textarea";
  noteEl.rows = 3;
  noteEl.placeholder = "Added extra lemon, kids loved it, would double the sauce...";
  noteEl.value = f.quickNote;
  noteEl.addEventListener("input", () => { state.form.quickNote = noteEl.value; });
  field("YOUR NOTES", noteEl);

  // Made it
  const checkRow = document.createElement("div");
  checkRow.className = "check-row";
  checkRow.addEventListener("click", () => { state.form.made = !state.form.made; render(); });
  const box = document.createElement("div");
  box.className = "check-box" + (f.made ? " checked" : "");
  box.textContent = f.made ? "✓" : "";
  const checkLbl = document.createElement("span");
  checkLbl.className = "check-label";
  checkLbl.textContent = "I've already made this";
  checkRow.appendChild(box);
  checkRow.appendChild(checkLbl);
  inner.appendChild(checkRow);

  // Buttons
  const btnRow = document.createElement("div");
  btnRow.className = "btn-row";

  const saveBtn = document.createElement("button");
  saveBtn.className = "btn-primary";
  saveBtn.textContent = isEdit ? "SAVE CHANGES" : "SAVE RECIPE";
  saveBtn.disabled = !f.title.trim();
  saveBtn.addEventListener("click", () => {
    const r = {
      ...f,
      title: f.title.trim(),
      source: f.source.trim(),
      body: f.body.trim(),
      quickNote: f.quickNote.trim(),
      sourceType: isUrl(f.source) ? "link" : "text",
    };
    if (isEdit) {
      r.updatedAt = Date.now();
      state.recipes = state.recipes.map(x => x.id === r.id ? r : x);
    } else {
      r.id = crypto.randomUUID();
      r.createdAt = Date.now();
      r.updatedAt = Date.now();
      state.recipes = [r, ...state.recipes];
    }
    save();
    setState({ modal: null, form: null, aiUsed: false });
  });

  const cancelBtn = document.createElement("button");
  cancelBtn.className = "btn-secondary";
  cancelBtn.textContent = "Cancel";
  cancelBtn.addEventListener("click", () => setState({ modal: null, form: null, aiUsed: false }));

  btnRow.appendChild(saveBtn);
  btnRow.appendChild(cancelBtn);
  inner.appendChild(btnRow);

  frag.appendChild(inner);
  return frag;
}

// ── RENDER MODAL: VIEW ──
function renderViewSheet(recipe) {
  const frag = document.createDocumentFragment();

  const handle = document.createElement("div");
  handle.className = "sheet-handle";
  frag.appendChild(handle);

  const inner = document.createElement("div");
  inner.className = "sheet-inner";

  // Made badge
  if (recipe.made) {
    const badge = document.createElement("div");
    badge.style.cssText = "display:inline-block;background:var(--green-bg);color:var(--green);font-size:9px;padding:3px 9px;border-radius:20px;border:1px solid var(--green-border);margin-bottom:10px;letter-spacing:0.5px;";
    badge.textContent = "MADE IT ✓";
    inner.appendChild(badge);
  }

  const title = document.createElement("div");
  title.className = "view-title";
  title.textContent = recipe.title;
  inner.appendChild(title);

  const starsWrap = document.createElement("div");
  starsWrap.style.marginBottom = "12px";
  starsWrap.appendChild(renderStars(recipe.rating||0, false, null));
  inner.appendChild(starsWrap);

  if (recipe.source) {
    if (recipe.sourceType === "link") {
      const a = document.createElement("a");
      a.className = "view-source";
      a.href = recipe.source;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "🔗 " + recipe.source;
      inner.appendChild(a);
    } else {
      const src = document.createElement("div");
      src.style.cssText = "font-size:11px;color:var(--text4);margin-bottom:12px;";
      src.textContent = "📋 Text source";
      inner.appendChild(src);
    }
  }

  if ((recipe.tags||[]).length) {
    const tagsRow = document.createElement("div");
    tagsRow.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;";
    recipe.tags.forEach(tag => tagsRow.appendChild(makeTag(tag, true, null)));
    inner.appendChild(tagsRow);
  }

  if (recipe.quickNote) {
    const note = document.createElement("div");
    note.className = "view-note";
    note.textContent = `"${recipe.quickNote}"`;
    inner.appendChild(note);
  }

  if (recipe.body) {
    const lbl = document.createElement("div");
    lbl.className = "field-label";
    lbl.textContent = "RECIPE / NOTES";
    inner.appendChild(lbl);
    const body = document.createElement("div");
    body.className = "view-body";
    body.textContent = recipe.body;
    inner.appendChild(body);
  }

  const date = document.createElement("div");
  date.className = "view-date";
  date.textContent = "Added " + fmtDate(recipe.createdAt);
  inner.appendChild(date);

  // Buttons
  const btnRow = document.createElement("div");
  btnRow.className = "btn-row";

  const editBtn = document.createElement("button");
  editBtn.style.cssText = "flex:1;background:var(--bg2);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:13px;font-size:13px;letter-spacing:0.5px;font-family:'DM Mono',monospace;";
  editBtn.textContent = "EDIT";
  editBtn.addEventListener("click", () => {
    setState({ modal: { type:"edit", id: recipe.id }, form: { ...recipe } });
  });

  const delBtn = document.createElement("button");
  delBtn.className = "btn-danger";
  delBtn.textContent = "DELETE";
  delBtn.addEventListener("click", () => {
    if (confirm("Delete this recipe?")) {
      state.recipes = state.recipes.filter(r => r.id !== recipe.id);
      save();
      setState({ modal: null });
    }
  });

  const closeBtn = document.createElement("button");
  closeBtn.className = "btn-secondary";
  closeBtn.textContent = "Close";
  closeBtn.addEventListener("click", () => setState({ modal: null }));

  btnRow.appendChild(editBtn);
  btnRow.appendChild(delBtn);
  btnRow.appendChild(closeBtn);
  inner.appendChild(btnRow);

  frag.appendChild(inner);
  return frag;
}

// ── RENDER CARD ──
function renderCard(recipe) {
  const card = document.createElement("div");
  card.className = "card";
  card.addEventListener("click", () => setState({ modal: { type:"view", id: recipe.id } }));

  if (recipe.made) {
    const badge = document.createElement("div");
    badge.className = "card-made-badge";
    badge.textContent = "MADE IT";
    card.appendChild(badge);
  }

  const title = document.createElement("div");
  title.className = "card-title";
  title.textContent = recipe.title;
  card.appendChild(title);

  if (recipe.source) {
    const src = document.createElement("div");
    src.className = "card-source";
    src.textContent = (recipe.sourceType === "link" ? "🔗 " : "📋 ") + recipe.source;
    card.appendChild(src);
  }

  if ((recipe.tags||[]).length) {
    const tagsRow = document.createElement("div");
    tagsRow.className = "card-tags";
    recipe.tags.forEach(tag => tagsRow.appendChild(makeTag(tag, true, null)));
    card.appendChild(tagsRow);
  }

  const footer = document.createElement("div");
  footer.className = "card-footer";
  footer.appendChild(renderStars(recipe.rating||0, false, null));
  const dateEl = document.createElement("div");
  dateEl.className = "card-date";
  dateEl.textContent = fmtDate(recipe.createdAt);
  footer.appendChild(dateEl);
  card.appendChild(footer);

  if (recipe.quickNote) {
    const note = document.createElement("div");
    note.className = "card-note";
    note.textContent = `"${recipe.quickNote}"`;
    card.appendChild(note);
  }

  return card;
}

// ── RENDER GRID ONLY ──
function renderGridOnly() {
  const grid = document.getElementById("recipe-grid");
  if (!grid) return;
  const filtered = getFiltered();
  grid.innerHTML = "";
  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.style.gridColumn = "1/-1";
    empty.innerHTML = state.recipes.length === 0
      ? '<div class="empty-icon">🫙</div><div class="empty-title">Your vault is empty</div><div class="empty-sub">Tap + ADD to save your first recipe</div>'
      : '<div class="empty-icon">🫙</div><div class="empty-title">No recipes match</div><div class="empty-sub">Try clearing your filters</div>';
    grid.appendChild(empty);
  } else {
    filtered.forEach(r => grid.appendChild(renderCard(r)));
  }
}

// ── MAIN RENDER ──
function render() {
  const app = document.getElementById("app");
  // Don't wipe the whole app if only modal changed and search is focused
  const searchFocused = document.activeElement && document.activeElement.classList.contains("search-input");
  if (searchFocused && !state.modal) {
    renderGridOnly();
    return;
  }
  app.innerHTML = "";

  // Header
  const header = document.createElement("div");
  header.className = "header";

  const headerLeft = document.createElement("div");
  const headerTitle = document.createElement("div");
  headerTitle.className = "header-title";
  headerTitle.textContent = "Recipe Vault";
  const headerCount = document.createElement("div");
  headerCount.className = "header-count";
  headerCount.textContent = state.recipes.length + (state.recipes.length === 1 ? " recipe" : " recipes") + " saved";
  headerLeft.appendChild(headerTitle);
  headerLeft.appendChild(headerCount);

  const addBtn = document.createElement("button");
  addBtn.className = "btn-add";
  addBtn.textContent = "+ ADD";
  addBtn.addEventListener("click", () => setState({ modal: "add", form: blankForm(), aiUsed: false }));

  header.appendChild(headerLeft);
  header.appendChild(addBtn);
  app.appendChild(header);

  // Filter bar
  const filterBar = document.createElement("div");
  filterBar.className = "filter-bar";

  const searchEl = document.createElement("input");
  searchEl.className = "search-input";
  searchEl.placeholder = "Search recipes...";
  searchEl.value = state.search;
  searchEl.setAttribute("autocomplete","off");
  searchEl.setAttribute("autocorrect","off");
  searchEl.setAttribute("autocapitalize","off");
  searchEl.setAttribute("spellcheck","false");
  let searchTimer;
  searchEl.addEventListener("input", e => {
    state.search = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { renderGridOnly(); }, 150);
  });
  filterBar.appendChild(searchEl);

  const tagsRow = document.createElement("div");
  tagsRow.className = "tags-row";
  tagsRow.appendChild(makeTag("All", !state.filterTag && !state.filterMade, () => setState({ filterTag: null, filterMade: false })));
  TAGS.forEach(tag => {
    tagsRow.appendChild(makeTag(tag, state.filterTag === tag, () => {
      setState({ filterTag: state.filterTag === tag ? null : tag, filterMade: false });
    }));
  });
  tagsRow.appendChild(makeTag("Made it ✓", state.filterMade, () => {
    setState({ filterMade: !state.filterMade, filterTag: null });
  }, "tag-made"));
  filterBar.appendChild(tagsRow);

  const sortRow = document.createElement("div");
  sortRow.className = "sort-row";
  const sortLbl = document.createElement("span");
  sortLbl.className = "sort-label";
  sortLbl.textContent = "SORT";
  sortRow.appendChild(sortLbl);
  ["newest","oldest","rating","alpha"].forEach(s => {
    const btn = document.createElement("button");
    btn.className = "sort-btn" + (state.sortBy === s ? " active" : "");
    btn.textContent = s.toUpperCase();
    btn.addEventListener("click", () => setState({ sortBy: s }));
    sortRow.appendChild(btn);
  });
  filterBar.appendChild(sortRow);
  app.appendChild(filterBar);

  // Grid
  const filtered = getFiltered();
  const grid = document.createElement("div");
  grid.className = "grid";
  grid.id = "recipe-grid";

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.style.gridColumn = "1/-1";
    empty.innerHTML = `<div class="empty-icon">🫙</div><div class="empty-title">${state.recipes.length === 0 ? "Your vault is empty" : "No recipes match"}</div><div class="empty-sub">${state.recipes.length === 0 ? "Tap + ADD to save your first recipe" : "Try clearing your filters"}</div>`;
    grid.appendChild(empty);
  } else {
    filtered.forEach(r => grid.appendChild(renderCard(r)));
  }
  app.appendChild(grid);

  // Modal
  if (state.modal) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.addEventListener("click", e => {
      if (e.target === overlay) setState({ modal: null, form: null, aiUsed: false });
    });

    const sheet = document.createElement("div");
    sheet.className = "sheet";

    if (state.modal === "add") {
      sheet.appendChild(renderFormSheet(false));
    } else if (state.modal?.type === "edit") {
      sheet.appendChild(renderFormSheet(true));
    } else if (state.modal?.type === "view") {
      const recipe = state.recipes.find(r => r.id === state.modal.id);
      if (recipe) sheet.appendChild(renderViewSheet(recipe));
    }

    overlay.appendChild(sheet);
    app.appendChild(overlay);
  }
}

// ── INIT ──
load();
render();
</script>
